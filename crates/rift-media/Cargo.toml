[package]
name = "rift-media"
version = "0.1.0"
edition = "2021"
description = "Audio capture, playback, and Opus codec for Rift P2P"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/infinityabundance/riftd"
keywords = ["audio", "opus", "codec", "voice"]
categories = ["multimedia::audio"]

[dependencies]
anyhow = "1"
cpal = "0.15"
opus = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
rift-protocol = { path = "../rift-protocol" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "media_opus"
harness = false
