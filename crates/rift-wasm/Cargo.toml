[package]
name = "rift-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for Rift P2P browser clients"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/infinityabundance/riftd"
keywords = ["wasm", "webassembly", "p2p", "browser"]
categories = ["wasm", "web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
thiserror = "1"
bincode = "1"
getrandom = { version = "0.2", features = ["js"] }
aes-gcm = "0.10"

rift-core = { path = "../rift-core", version = "0.1.0" }
rift-protocol = { path = "../rift-protocol", version = "0.1.0" }

[features]
wasm = []

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[package.metadata.docs.rs]
all-features = true
targets = ["wasm32-unknown-unknown"]
