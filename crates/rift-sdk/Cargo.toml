[package]
name = "rift-sdk"
version = "0.1.4"
edition = "2021"
description = "High-level SDK for building Rift P2P applications"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/infinityabundance/riftd"
documentation = "https://docs.rs/rift-sdk"
keywords = ["p2p", "sdk", "voice", "chat"]
categories = ["network-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"
rift-core = { path = "../rift-core", version = "0.1.4" }
rift-protocol = { path = "../rift-protocol", version = "0.1.4" }
rift-discovery = { path = "../rift-discovery", version = "0.1.4" }
rift-nat = { path = "../rift-nat", version = "0.1.4" }
rift-mesh = { path = "../rift-mesh", version = "0.1.4" }
rift-rndzv = { path = "../rift-rndzv", version = "0.1.4" }
rift-media = { path = "../rift-media", version = "0.1.4" }
rift-dht = { path = "../rift-dht", version = "0.1.4" }
rift-metrics = { path = "../rift-metrics", version = "0.1.4" }
serde = { version = "1", features = ["derive"] }
hex = "0.4"
rand = "0.8"
thiserror = "1"
toml = "0.8"
hkdf = "0.12"
sha2 = "0.10"
serde_json = "1"
dirs = "5"
blake3 = "1"
jni = { version = "0.21", optional = true }
ndk-context = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
ffi = []
android = ["jni", "ndk-context"]

[package.metadata.docs.rs]
all-features = true
