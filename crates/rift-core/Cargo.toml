[package]
name = "rift-core"
version = "0.1.0"
edition = "2021"
description = "Core types, identity, cryptography, and invites for the Rift P2P protocol"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/infinityabundance/riftd"
keywords = ["p2p", "voip", "cryptography", "identity"]
categories = ["network-programming", "cryptography"]

[dependencies]
base64 = "0.21"
blake3 = "1"
bincode = "1"
ed25519-dalek = { version = "1", features = ["rand"] }
hex = "0.4"
hkdf = "0.12"
rand = "0.7"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
snow = "0.9"
thiserror = "1"
x25519-dalek = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[package.metadata.docs.rs]
all-features = true
