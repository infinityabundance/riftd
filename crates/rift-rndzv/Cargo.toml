[package]
name = "rift-rndzv"
version = "0.1.0"
edition = "2021"
description = "Rendezvous protocol for Rift P2P NAT traversal"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/infinityabundance/riftd"
keywords = ["rendezvous", "nat", "p2p", "hole-punching"]
categories = ["network-programming"]

[dependencies]
base64 = "0.21"
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "time", "rt", "sync", "macros"] }
tracing = "0.1"
rift-core = { path = "../rift-core", version = "0.1.0" }
rift-nat = { path = "../rift-nat", version = "0.1.0" }

[dev-dependencies]
