[package]
name = "rift-rndzv"
version = "0.1.3"
edition = "2021"
description = "Rendezvous protocol for Rift P2P NAT traversal"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/infinityabundance/riftd"
documentation = "https://docs.rs/rift-rndzv"
keywords = ["rendezvous", "nat", "p2p", "hole-punching"]
categories = ["network-programming"]

[dependencies]
base64 = "0.21"
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "time", "rt", "sync", "macros"] }
tracing = "0.1"
rift-core = { path = "../rift-core", version = "0.1.3" }
rift-nat = { path = "../rift-nat", version = "0.1.3" }

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
