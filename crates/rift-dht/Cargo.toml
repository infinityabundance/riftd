[package]
name = "rift-dht"
version = "0.1.1"
edition = "2021"
description = "Distributed hash table for Rift P2P peer discovery"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/infinityabundance/riftd"
keywords = ["dht", "kademlia", "p2p", "discovery"]
categories = ["network-programming"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
futures = "0.3"
libp2p = { version = "0.53", features = ["kad", "tcp", "dns", "noise", "yamux", "tokio", "identify", "macros"] }
rift-core = { path = "../rift-core", version = "0.1.1" }
rift-metrics = { path = "../rift-metrics", version = "0.1.1" }
tracing = "0.1"

[package.metadata.docs.rs]
all-features = true
