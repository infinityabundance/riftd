[package]
name = "rift-protocol"
version = "0.1.0"
edition = "2021"
description = "Versioned wire protocol framing and message types for Rift P2P"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/infinityabundance/riftd"
keywords = ["p2p", "protocol", "networking"]
categories = ["network-programming"]

[dependencies]
bincode = "1"
blake3 = "1"
hex = "0.4"
rand = "0.7"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
rift-core = { path = "../rift-core" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "mesh_encode_decode"
harness = false
