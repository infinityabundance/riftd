[package]
name = "rift-web-chat"
version = "0.1.4"
edition = "2021"
description = "WebAssembly browser chat client for Rift over WebSocket relay"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/infinityabundance/riftd"
documentation = "https://docs.rs/rift-web-chat"
keywords = ["wasm", "webassembly", "chat", "p2p", "browser"]
categories = ["wasm", "web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
thiserror = "1"
base64 = "0.22"
bincode = "1"
aes-gcm = "0.10"
getrandom = { version = "0.2", features = ["js"] }

rift-core = { path = "../rift-core", version = "0.1.4" }
rift-protocol = { path = "../rift-protocol", version = "0.1.4" }

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "BinaryType",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[package.metadata.docs.rs]
all-features = true
targets = ["wasm32-unknown-unknown"]
