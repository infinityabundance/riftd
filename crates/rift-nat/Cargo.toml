[package]
name = "rift-nat"
version = "0.1.0"
edition = "2021"
description = "NAT traversal, STUN, and TURN support for Rift P2P"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/infinityabundance/riftd"
keywords = ["p2p", "nat", "stun", "turn", "networking"]
categories = ["network-programming"]

[dependencies]
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt"] }
rift-core = { path = "../rift-core", version = "0.1.0" }
rift-metrics = { path = "../rift-metrics", version = "0.1.0" }
tracing = "0.1"
rand = "0.8"
get_if_addrs = "0.5"
hmac = "0.12"
sha1 = "0.10"
crc32fast = "1"

[package.metadata.docs.rs]
all-features = true
