[package]
name = "rift-discovery"
version = "0.1.3"
edition = "2021"
description = "Peer discovery via mDNS and DHT for Rift P2P"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/infinityabundance/riftd"
documentation = "https://docs.rs/rift-discovery"
keywords = ["p2p", "mdns", "dht", "discovery"]
categories = ["network-programming"]

[dependencies]
hex = "0.4"
mdns-sd = "0.11"
if-addrs = "0.13"
rift-core = { path = "../rift-core", version = "0.1.3" }
thiserror = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tokio-stream = "0.1"
rift-dht = { path = "../rift-dht", version = "0.1.3" }

[package.metadata.docs.rs]
all-features = true
