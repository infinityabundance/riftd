[package]
name = "rift"
version = "0.1.1"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
ratatui = "0.26"
crossterm = "0.27"
hex = "0.4"
blake3 = "1"
rand = "0.8"
hkdf = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
qrcode = "0.14"
rift-core = { path = "../../crates/rift-core", version = "0.1.1" }
rift-mesh = { path = "../../crates/rift-mesh", version = "0.1.1" }
rift-nat = { path = "../../crates/rift-nat", version = "0.1.1" }
rift-protocol = { path = "../../crates/rift-protocol", version = "0.1.1" }
rift-rndzv = { path = "../../crates/rift-rndzv", version = "0.1.1" }
rift-sdk = { path = "../../crates/rift-sdk", version = "0.1.1" }
rift-metrics = { path = "../../crates/rift-metrics", version = "0.1.1" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "signal", "time", "sync", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
