name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.1.10909125"
      - name: Build Rust Android
        run: |
          cd android
          ./build-rust-android.sh
      - name: Assemble release APK
        run: |
          cd android
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android/app/build/outputs/apk/release/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.*'
          modules: 'qtmultimedia'
      - name: Build Rust SDK
        run: cargo build --release -p rift-sdk --features ffi
      - name: Configure Qt client
        run: |
          cmake -S clients/rift-qt-unified -B build-qt -DRIFT_SDK_LIB="${{ github.workspace }}/target/release/rift_sdk.lib"
      - name: Build Qt client
        run: cmake --build build-qt --config Release
      - name: Package Windows
        run: |
          mkdir dist
          cp build-qt/Release/RiftQt.exe dist/
          windeployqt --qmldir clients/rift-qt-unified/qml dist/RiftQt.exe
          Compress-Archive -Path dist/* -DestinationPath rift-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: rift-windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.*'
          modules: 'qtmultimedia'
      - name: Build Rust SDK (universal)
        run: |
          cargo build --release -p rift-sdk --features ffi --target x86_64-apple-darwin
          cargo build --release -p rift-sdk --features ffi --target aarch64-apple-darwin
          mkdir -p target/release
          lipo -create \
            target/x86_64-apple-darwin/release/librift_sdk.a \
            target/aarch64-apple-darwin/release/librift_sdk.a \
            -output target/release/librift_sdk.a
      - name: Configure Qt client
        run: |
          cmake -S clients/rift-qt-unified -B build-qt \
            -DCMAKE_BUILD_TYPE=Release \
            -DRIFT_SDK_LIB="${{ github.workspace }}/target/release/librift_sdk.a"
      - name: Build Qt client
        run: cmake --build build-qt --config Release
      - name: Package macOS
        run: |
          macdeployqt build-qt/RiftQt.app -qmldir=clients/rift-qt-unified/qml
          hdiutil create -volname "Rift" -srcfolder build-qt/RiftQt.app -ov -format UDZO rift-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: rift-macos-universal.dmg

  release:
    needs: [build-android, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/android-release/*.apk
            artifacts/windows-release/rift-windows-x64.zip
            artifacts/macos-release/rift-macos-universal.dmg
          generate_release_notes: true
